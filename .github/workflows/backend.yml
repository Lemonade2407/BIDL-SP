name: Backend A
on:
  push:
    branches: ['feat/**', dev, master, main]
  pull_request:
permissions:
  contents: read
jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bidl
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: bidlsp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bidl -d bidlsp_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://bidl:isolated-test-only@localhost:5432/bidlsp_test
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storage: [local, minio]
    env:
      STORAGE_BACKEND: ${{ matrix.storage }}
      COMPOSE_PROFILES: ${{ matrix.storage == 'minio' && 'minio' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend/app backend/tests --select E9,F63,F7,F82
      - run: pytest backend/tests algo/tests -q
      - run: python transunet/scripts/verify_metrics.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend assets served by Nginx
        run: python deploy/build_frontend.py
      - name: Validate deployment configuration
        run: |
          python deploy/generate_env.py
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml config --quiet
      - name: Start optional MinIO before storage initialization
        if: matrix.storage == 'minio'
        run: docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build --wait minio
      - name: Boot full deployment including algorithm worker
        run: docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build --wait
      - name: Verify PostgreSQL, Redis and selected object storage
        run: |
          curl --fail --show-error http://localhost:8080/api/v1/readyz
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml exec -T api python -c "from app.config import settings; assert settings.storage_backend == '${{ matrix.storage }}', settings.storage_backend"
      - name: Verify MinIO rejects anonymous bucket access
        if: matrix.storage == 'minio'
        run: |
          status=$(curl --show-error --silent --output /dev/null --write-out '%{http_code}' http://localhost:9000/bidlsp-raw/)
          test "$status" = "403" || { echo "Expected private bucket HTTP 403, got $status"; exit 1; }
      - name: Verify algorithm dependencies and asynchronous import
        run: |
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml exec -T worker python -c "import sys; sys.path.insert(0, '/opt/bidl/transunet/TransUNet'); from networks.vit_seg_modeling import VisionTransformer; from algo.adapter.predictor import Predictor; print('Algorithm imports OK')"
          python backend/scripts/smoke_compose.py --storage-backend ${{ matrix.storage }}
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify UI login and key pages
        run: python backend/scripts/e2e_ui.py
      - if: failure()
        run: docker compose --env-file deploy/.env -f deploy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose --env-file deploy/.env -f deploy/docker-compose.yml down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
