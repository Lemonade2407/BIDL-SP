name: bidlsp

x-platform: &platform
  DATABASE_URL: postgresql+psycopg://bidl:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/bidlsp
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: minio
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-bidlsp}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
  DEVICE: cpu
  WORK_DIR: /opt/bidl/.runtime/work
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bidl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: bidlsp
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidl -d bidlsp"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bidlsp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  init:
    build: {context: .., dockerfile: deploy/Dockerfile, target: api}
    environment:
      <<: *platform
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    depends_on:
      db: {condition: service_healthy}
      minio: {condition: service_healthy}
    command: ["sh", "-c", "alembic -c backend/alembic.ini upgrade head && python -m app.cli init-storage && python -m app.cli seed-admin"]
    restart: "no"

  api:
    build: {context: .., dockerfile: deploy/Dockerfile, target: api}
    environment: *platform
    depends_on:
      init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["api-work:/opt/bidl/.runtime"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build: {context: .., dockerfile: deploy/Dockerfile, target: worker}
    environment: *platform
    depends_on:
      init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    volumes: ["worker-work:/opt/bidl/.runtime"]
    restart: unless-stopped

  scheduler:
    build: {context: .., dockerfile: deploy/Dockerfile, target: api}
    environment: *platform
    command: ["celery", "-A", "app.worker:app", "beat", "-l", "info", "--schedule", "/opt/bidl/.runtime/celerybeat-schedule"]
    depends_on:
      init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    volumes: ["scheduler-work:/opt/bidl/.runtime"]
    restart: unless-stopped

  dispatcher:
    build: {context: .., dockerfile: deploy/Dockerfile, target: api}
    environment: *platform
    command: ["celery", "-A", "app.worker:app", "worker", "-Q", "celery", "-c", "1", "-l", "info"]
    depends_on:
      init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  api-work:
  worker-work:
  scheduler-work:
